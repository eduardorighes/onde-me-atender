# Casos de avaliação do agente "Onde me atender".
# Todos os CEPs foram confirmados com chamadas reais ao ViaCEP em 14/11/2026.
#
# Campos (todos opcionais, exceto id e pergunta/turnos):
#   pergunta               texto do usuário (ou `turnos`: lista de mensagens, para conversas)
#   categoria              busca | servico | emergencia | sem_cep | erro | sem_unidade | fora_escopo | conversa
#   ferramentas_esperadas  ferramentas que DEVEM ser chamadas ([] = nenhuma ferramenta)
#   ferramentas_alternativas  outros conjuntos de ferramentas também aceitos (lista de listas);
#                          por esse caminho o gabarito (Hit@5 e Precisão@5) não é medido
#   municipio_esperado     código IBGE de 6 dígitos do CEP passado a buscar_estabelecimentos
#   tipos_aceitos          códigos de tipo de unidade considerados coerentes com o pedido
#   tipos_de_apoio         tipos também aceitos nos argumentos, mas fora do gabarito (ex.: a UBS de
#                          referência que o prompt manda indicar junto com o serviço especializado)
#   cep                    CEP usado para montar o gabarito (Hit@5 e Precisão@5)
#   deve_conter            textos obrigatórios na resposta final
#   deve_conter_algum      pelo menos um destes textos deve aparecer
#   nao_deve_conter        textos proibidos na resposta final
#
# Os códigos de tipo aqui servem só para AVALIAR; o agente precisa descobri-los
# sozinho com listar_tipos_unidade. Referência (tabela /cnes/tipounidades):
#   1 posto de saúde · 2 centro de saúde/unidade básica · 4 policlínica · 5 hospital geral
#   7 hospital especializado · 15 unidade mista · 20 pronto socorro geral
#   21 pronto socorro especializado · 36 clínica/centro de especialidade
#   70 CAPS · 73 pronto atendimento · 85 centro de imunização

